<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tile" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1D24"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="blue" x1="160" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BA3F0"/>
      <stop offset="1" stop-color="#4A7AD9"/>
    </linearGradient>
    <linearGradient id="page" x1="140" y1="140" x2="280" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2E38"/>
      <stop offset="1" stop-color="#1C1F28"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <!-- subtle inner frame -->
  <rect x="32" y="32" width="448" height="448" rx="98" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Left page (comic panel stack) -->
  <path d="M118 148c0-18 14-32 32-32h118v280H150c-18 0-32-14-32-32V148z" fill="url(#page)"/>
  <!-- panel lines on left page -->
  <path d="M150 196h100M150 244h88M150 292h96" stroke="rgba(255,255,255,0.12)" stroke-width="10" stroke-linecap="round"/>

  <!-- Right page folded / accent -->
  <path d="M268 116h94c20 0 36 16 36 36v208c0 20-16 36-36 36h-94V116z" fill="url(#blue)"/>
  <!-- soft fold highlight -->
  <path d="M268 116v280" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Characteristic mark: stylized open-eye / "read" lens (unique, not a letter) -->
  <ellipse cx="315" cy="250" rx="42" ry="28" fill="none" stroke="#F2F5FA" stroke-width="14"/>
  <circle cx="315" cy="250" r="14" fill="#F2F5FA"/>
  <!-- small arc under eye = smile of discovery / page turn -->
  <path d="M292 292c10 12 36 12 46 0" stroke="#F2F5FA" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
